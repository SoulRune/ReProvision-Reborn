name: Build deb (rootless + rootful)

on:
  push:
    branches: [master, main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Pick the newest installed Xcode 16.x whose iphoneos SDK has a matching
          # simulator runtime on the runner. Forcing plain Xcode_16.app pins SDK 18.0,
          # whose simulator runtime is usually absent -> ibtool/actool fail with
          # "iOS 18.0 Platform Not Installed". A later 16.x (e.g. 16.4 = SDK 18.5)
          # ships a runtime the runner actually has.
          newest="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$newest" ]; then newest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1)"; fi
          echo "Selecting $newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version
          echo "Installed iOS simulator runtimes:"
          xcrun simctl list runtimes || true

      - name: Install build tools
        run: |
          brew update
          brew install ldid dpkg coreutils || true
          which ldid dpkg-deb

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document
          pod --version

      - name: Pod install
        run: |
          pod install --repo-update --verbose

      - name: Build iOS target (unsigned, arm64)
        env:
          ARCHS: arm64
          ONLY_ACTIVE_ARCH: "NO"
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ReProvision.xcworkspace \
            -scheme iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_BITCODE=NO \
            ENABLE_ON_DEMAND_RESOURCES=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            build | tee xcodebuild.log

      - name: Build rootful .deb
        run: |
          set -e
          # The Xcode build phase already produced the rootless .deb and left the
          # signed app + daemon under iOS/Package/var/jb. Entitlements are
          # path-independent, so the SAME signed binaries work at rootful paths -
          # only the package layout/control/scripts differ. Reuse them here.
          PKG="iOS/Package-rootful"
          RL="iOS/Package/var/jb"

          if [ ! -d "$RL/Applications/ReProvision.app" ] || [ ! -f "$RL/usr/libexec/reprovisiond" ]; then
            echo "error: signed rootless products not found - did the build phase run?"
            exit 1
          fi

          rm -rf "$PKG/Applications/ReProvision.app" "$PKG/usr/libexec/reprovisiond"
          cp -R "$RL/Applications/ReProvision.app" "$PKG/Applications/"
          cp "$RL/usr/libexec/reprovisiond" "$PKG/usr/libexec/"

          MAJOR=$(/usr/libexec/PlistBuddy -c "Print :Major" iOS/PackageVersion.plist)
          MINOR=$(/usr/libexec/PlistBuddy -c "Print :Minor" iOS/PackageVersion.plist)
          BUGFIX=$(/usr/libexec/PlistBuddy -c "Print :BugFix" iOS/PackageVersion.plist)
          STAGE=$(/usr/libexec/PlistBuddy -c "Print :Stage" iOS/PackageVersion.plist 2>/dev/null || echo "")
          REV=$(/usr/libexec/PlistBuddy -c "Print :PackageRevision" iOS/PackageVersion.plist 2>/dev/null || echo "")
          if [ -n "$REV" ]; then VERSION="${MAJOR}.${MINOR}.${BUGFIX}.${REV}${STAGE}"; else VERSION="${MAJOR}.${MINOR}.${BUGFIX}${STAGE}"; fi

          /usr/libexec/PlistBuddy -c "Set :Version ${VERSION}" "$PKG/DEBIAN/control" >/dev/null 2>&1 || \
            /usr/bin/sed -i '' -E "s/^Version:.*/Version: ${VERSION}/" "$PKG/DEBIAN/control"

          chmod 0755 "$PKG/DEBIAN/postinst" "$PKG/DEBIAN/prerm" 2>/dev/null || true
          find "$PKG" \( -name .DS_Store -o -name .gitkeep \) -delete 2>/dev/null || true

          mkdir -p iOS/CydiaPackages
          dpkg-deb -Zgzip -b "$PKG" "iOS/CydiaPackages/jp.soh.reprovision_${VERSION}_iphoneos-arm.deb"
          echo "Built rootful iOS/CydiaPackages/jp.soh.reprovision_${VERSION}_iphoneos-arm.deb"

      - name: List produced debs
        run: |
          ls -la iOS/CydiaPackages/ || true

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reprovision-debs
          path: iOS/CydiaPackages/*.deb
          if-no-files-found: error

      - name: Upload xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download deb artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.deb
          fail_on_unmatched_files: true
